<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shared :: head('Đăng nhập')}"></head>
<body class="d-flex min-vh-100 align-items-center py-5">
<a th:replace="~{fragments/shared :: skip}"></a>
<main id="main" tabindex="-1" class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <section class="card border-0 shadow-sm">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-reset text-decoration-none">
                        <span th:replace="~{fragments/shared :: brand}"></span>
                    </div>
                    <h1 class="h3 fw-semibold mt-4 mb-2">Chào mừng trở lại</h1>
                    <p class="text-secondary mb-4">Đăng nhập để tiếp tục quản lý căn hộ và hóa đơn của bạn.</p>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label" for="username">Email</label>
                            <input class="form-control" id="username" name="username" type="email" autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Mật khẩu</label>
                            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-primary w-100 mt-2" type="submit">Đăng nhập</button>
                    </form>

                    <p class="alert alert-danger mt-3 mb-0" th:if="${loginError}" th:text="${loginError}" role="alert"></p>
                    <p class="alert alert-success mt-3 mb-0" th:if="${logoutMessage}" th:text="${logoutMessage}" role="status"></p>
                    <p class="small text-secondary text-center mt-4 mb-0">Hiên Nhà · Khu vực phát triển</p>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>

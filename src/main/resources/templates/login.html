<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Rental Apartment</title>
    <style>
        :root { color-scheme: light; font-family: Inter, Segoe UI, Arial, sans-serif; color: #172033; background: #f4f6fb; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
        .card { width: min(100%, 420px); background: #fff; border: 1px solid #e4e8f0; border-radius: 18px; padding: 36px; box-shadow: 0 18px 50px #23345b12; }
        .mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: #e9efff; color: #3458c5; font-size: 22px; font-weight: 800; }
        h1 { margin: 22px 0 6px; font-size: 26px; letter-spacing: -.4px; }
        .subtitle { margin: 0 0 26px; color: #68738a; font-size: 14px; line-height: 1.5; }
        label { display: block; margin: 16px 0 7px; font-size: 13px; font-weight: 650; }
        input { width: 100%; height: 46px; border: 1px solid #d8deea; border-radius: 9px; padding: 0 12px; font: inherit; outline: none; }
        input:focus { border-color: #5273dc; box-shadow: 0 0 0 3px #5273dc1c; }
        button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 9px; background: #3458c5; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #2849ae; }
        .message { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 13px; }
        .error { color: #9a2f36; background: #fff0f0; }
        .success { color: #24704f; background: #eaf8f0; }
        .foot { margin: 22px 0 0; text-align: center; color: #8992a5; font-size: 12px; }
    </style>
</head>
<body>
<main class="card">
    <div class="mark" aria-hidden="true">R</div>
    <h1>Chào mừng trở lại</h1>
    <p class="subtitle">Đăng nhập để tiếp tục quản lý căn hộ và hóa đơn của bạn.</p>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Email</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus>

        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Đăng nhập</button>
    </form>

    <p class="message error" th:if="${loginError}" th:text="${loginError}" role="alert"></p>
    <p class="message success" th:if="${logoutMessage}" th:text="${logoutMessage}"></p>
    <p class="foot">Rental Apartment · Khu vực phát triển</p>
</main>
</body>
</html>

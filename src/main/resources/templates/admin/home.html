<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản trị | Rental Apartment</title>
    <style>
        body { margin: 0; padding: 40px; font-family: Segoe UI, Arial, sans-serif; color: #172033; background: #f4f6fb; }
        main { max-width: 760px; margin: 0 auto; padding: 28px; border: 1px solid #e4e8f0; border-radius: 14px; background: white; }
        a { color: #3458c5; }
        p { line-height: 1.6; }
    </style>
</head>
<body>
<main>
    <h1>Khu vực Admin</h1>
    <p>Trang này chỉ dành cho tài khoản có quyền <strong>ROLE_ADMIN</strong>.</p>
    <p>Đăng nhập: <strong th:text="${email}">admin@example.com</strong></p>
    <p>Authorities: <strong th:text="${authorities}">[ROLE_ADMIN]</strong></p>
    <p><a th:href="@{/admin/billing}">Mở danh sách nghĩa vụ và nhập tiền điện nước</a></p>
    <p><a th:href="@{/admin/payment/reconciliation}">Ghi nhận thanh toán tiền mặt hoặc chuyển khoản</a></p>
    <p><a th:href="@{/}">Về trang chủ</a></p>
</main>
</body>
</html>

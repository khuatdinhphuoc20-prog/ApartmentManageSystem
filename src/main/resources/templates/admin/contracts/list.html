
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin :: layout(
          'Quản lý hợp đồng',
          'contracts',
          ~{::#contract-content}
      )}">

<body>
<div id="contract-content">

    <div class="container-fluid">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Quản lý hợp đồng</h3>
                <p class="text-muted mb-0">
                    Danh sách các hợp đồng thuê phòng
                </p>
            </div>

            <a th:href="@{/admin/contracts/create}"
               class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>
                Tạo hợp đồng
            </a>
        </div>

        <!-- Success message -->
        <div th:if="${successMessage != null}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>

        <!-- Error message -->
        <div th:if="${errorMessage != null}"
             class="alert alert-danger alert-dismissible fade show"
             role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>
        </div>
        <!-- Search and filter -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">

                <form th:action="@{/admin/contracts}"
                      method="get">

                    <div class="row g-3 align-items-end">

                        <!-- Search tenant -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Tìm kiếm người thuê
                            </label>

                            <input type="text"
                                   class="form-control"
                                   name="keyword"
                                   placeholder="Nhập tên người thuê..."
                                   th:value="${keyword}">
                        </div>

                        <!-- Filter status -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">
                                Trạng thái hợp đồng
                            </label>

                            <select class="form-select"
                                    name="status">

                                <option value=""
                                        th:selected="${statusFilter == null}">
                                    Tất cả trạng thái
                                </option>

                                <option th:each="s : ${statuses}"
                                        th:value="${s.name()}"
                                        th:selected="${statusFilter == s}"
                                        th:text="${s.name() == 'ACTIVE' ? 'Đang hiệu lực' :
                                          s.name() == 'SCHEDULED' ? 'Chờ hiệu lực' :
                                          s.name() == 'ENDED' ? 'Đã kết thúc' :
                                          s.name() == 'CANCELLED' ? 'Đã hủy' : s.name()}">
                                </option>

                            </select>
                        </div>

                        <!-- Buttons -->
                        <div class="col-md-2 d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary flex-grow-1">
                                <i class="bi bi-search"></i>
                                Lọc
                            </button>

                            <a th:href="@{/admin/contracts}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-counterclockwise"></i>
                                Reset
                            </a>

                        </div>

                    </div>
                </form>

            </div>
        </div>
        <!-- Contract table -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-semibold">
                    Danh sách hợp đồng
                </h5>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">
                        <tr>
                            <th class="text-center">STT</th>
                            <th>Phòng</th>
                            <th>Người thuê</th>
                            <th>CCCD</th>
                            <th>Số điện thoại</th>
                            <th>Tiền thuê/tháng</th>
                            <th>Ngày bắt đầu</th>
                            <th>Ngày kết thúc</th>
                            <th class="text-center">Trạng thái</th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                        </thead>

                        <tbody>

                        <!-- Contract rows -->
                        <tr th:each="contract, stat : ${contracts}">

                            <!-- STT -->
                            <td class="text-center"
                                th:text="${stat.count}">
                            </td>

                            <!-- Room -->
                            <td>
                                <span class="fw-semibold"
                                      th:text="${contract.roomCode}">
                                </span>
                            </td>

                            <!-- Tenant -->
                            <td th:text="${contract.tenantName}">
                            </td>

                            <!-- Identity document -->
                            <td th:text="${contract.identityDocumentNo}">
                            </td>

                            <!-- Phone -->
                            <td th:text="${contract.phone}">
                            </td>

                            <!-- Monthly rent -->
                            <td class="fw-semibold text-nowrap"
                                th:text="${#numbers.formatDecimal(
                                    contract.agreedMonthlyRent,
                                    0, 'COMMA', 0, 'POINT'
                                ) + ' đ'}">
                            </td>

                            <!-- Start date -->
                            <td class="text-nowrap"
                                th:text="${#temporals.format(
                                    contract.startDate,
                                    'dd/MM/yyyy'
                                )}">
                            </td>

                            <!-- End date -->
                            <td class="text-nowrap"
                                th:text="${#temporals.format(
                                    contract.plannedEndDate,
                                    'dd/MM/yyyy'
                                )}">
                            </td>

                            <!-- Status -->
                            <td class="text-center">
                                <span th:switch="${contract.status.name()}">

                                    <span th:case="'ACTIVE'"
                                          class="badge bg-success">
                                        Đang hiệu lực
                                    </span>

                                    <span th:case="'SCHEDULED'"
                                          class="badge bg-warning text-dark">
                                        Chờ hiệu lực
                                    </span>

                                    <span th:case="'ENDED'"
                                          class="badge bg-secondary">
                                        Đã kết thúc
                                    </span>

                                    <span th:case="'CANCELLED'"
                                          class="badge bg-danger">
                                        Đã hủy
                                    </span>

                                    <span th:case="*"
                                          class="badge bg-light text-dark"
                                          th:text="${contract.status}">
                                    </span>

                                </span>
                            </td>

                            <!-- Action -->
                            <td class="text-center">
                                <a th:href="@{/admin/contracts/{id}(
                                        id=${contract.id}
                                    )}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                    Chi tiết
                                </a>
                            </td>

                        </tr>

                        <!-- Empty state -->
                        <tr th:if="${#lists.isEmpty(contracts)}">
                            <td colspan="10"
                                class="text-center py-5">

                                <i class="bi bi-file-earmark-text
                                          text-muted"
                                   style="font-size: 40px;">
                                </i>

                                <p class="text-muted mt-2 mb-0">
                                    Chưa có hợp đồng nào.
                                </p>
                            </td>
                        </tr>

                        </tbody>
                    </table>

                </div>
            </div>
        </div>

    </div>

</div>
</body>
</html>

<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/customer :: layout('Trang chủ', 'rooms', ~{::article})}">
<body>
<article class="container py-4 py-lg-5">
    <header class="customer-hero rounded-4 overflow-hidden px-4 px-lg-5">
        <div class="row align-items-center">
            <div class="col-md-6 pt-4 pb-md-4">
                <h1 class="display-5 fw-semibold">Tìm phòng tại<br>Hiên Nhà</h1>
                <p class="mb-4">Xem giá thuê, diện tích và sức chứa để chọn căn phòng phù hợp với bạn.</p>
                <div class="d-flex flex-wrap gap-2">
                    <a class="btn btn-primary" th:href="@{/customer/invoices}">Hóa đơn &amp; thanh toán</a>
                    <a class="btn btn-outline-secondary" href="#rooms">Khám phá phòng</a>
                </div>
            </div>
            <div class="col-md-6"><img class="hero-art w-100" th:src="@{/images/building.svg}" alt="" width="540" height="290"></div>
        </div>
    </header>

    <!-- Thông báo lỗi chuyển hướng nếu có -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mt-4" role="alert" th:text="${errorMessage}"></div>

    <section id="rooms" class="pt-5" aria-labelledby="rooms-title">
        <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-3">
            <div>
                <h2 id="rooms-title" class="h3 mb-1">Phòng còn cho thuê</h2>
                <p class="text-secondary mb-0">Danh sách phòng đang sẵn sàng đón bạn đến thuê.</p>
            </div>
            <div id="room-search" hidden>
                <label for="room-code" class="form-label small mb-1">Tìm theo mã phòng</label>
                <input class="form-control" type="search" id="room-code" placeholder="Ví dụ: 101" aria-controls="room-list">
            </div>
        </div>

        <!-- Bộ lọc tìm kiếm chi tiết (UC05) -->
        <div class="card border-0 shadow-sm rounded-4 mb-4 bg-light">
            <div class="card-body p-3 p-md-4">
                <form th:action="@{/rooms}" method="get" class="row g-3 align-items-end">
                    <!-- 1. Chọn Tầng -->
                    <div class="col-6 col-md-3 col-lg-2">
                        <label for="floorNumber" class="form-label small fw-semibold text-secondary mb-1">
                            <svg th:replace="~{fragments/shared :: icon('building')}"></svg> Tầng
                        </label>
                        <select id="floorNumber" name="floorNumber" class="form-select form-select-sm">
                            <option value="">Tất cả tầng</option>
                            <option value="1" th:selected="${floorNumber != null && floorNumber == 1}">Tầng 1</option>
                            <option value="2" th:selected="${floorNumber != null && floorNumber == 2}">Tầng 2</option>
                            <option value="3" th:selected="${floorNumber != null && floorNumber == 3}">Tầng 3</option>
                            <option value="4" th:selected="${floorNumber != null && floorNumber == 4}">Tầng 4</option>
                            <option value="5" th:selected="${floorNumber != null && floorNumber == 5}">Tầng 5</option>
                        </select>
                    </div>

                    <!-- 2. Khoảng giá tối đa -->
                    <div class="col-6 col-md-3 col-lg-3">
                        <label for="maxPrice" class="form-label small fw-semibold text-secondary mb-1">
                            <svg th:replace="~{fragments/shared :: icon('wallet')}"></svg> Giá tối đa
                        </label>
                        <select id="maxPrice" name="maxPrice" class="form-select form-select-sm">
                            <option value="">Mọi mức giá</option>
                            <option value="2500000" th:selected="${maxPrice != null && maxPrice.compareTo(new java.math.BigDecimal('2500000')) == 0}">Dưới 2.500.000 đ</option>
                            <option value="3500000" th:selected="${maxPrice != null && maxPrice.compareTo(new java.math.BigDecimal('3500000')) == 0}">Dưới 3.500.000 đ</option>
                            <option value="4500000" th:selected="${maxPrice != null && maxPrice.compareTo(new java.math.BigDecimal('4500000')) == 0}">Dưới 4.500.000 đ</option>
                        </select>
                    </div>

                    <!-- 3. Sức chứa tối thiểu -->
                    <div class="col-6 col-md-3 col-lg-2">
                        <label for="minCapacity" class="form-label small fw-semibold text-secondary mb-1">
                            <svg th:replace="~{fragments/shared :: icon('people')}"></svg> Sức chứa
                        </label>
                        <select id="minCapacity" name="minCapacity" class="form-select form-select-sm">
                            <option value="">Tất cả</option>
                            <option value="1" th:selected="${minCapacity != null && minCapacity == 1}">Từ 1 người</option>
                            <option value="2" th:selected="${minCapacity != null && minCapacity == 2}">Từ 2 người</option>
                            <option value="3" th:selected="${minCapacity != null && minCapacity == 3}">Từ 3 người trở lên</option>
                        </select>
                    </div>

                    <!-- 4. Diện tích tối thiểu -->
                    <div class="col-6 col-md-3 col-lg-2">
                        <label for="minArea" class="form-label small fw-semibold text-secondary mb-1">
                            <svg th:replace="~{fragments/shared :: icon('area')}"></svg> Diện tích
                        </label>
                        <select id="minArea" name="minArea" class="form-select form-select-sm">
                            <option value="">Tất cả</option>
                            <option value="20" th:selected="${minArea != null && minArea.compareTo(new java.math.BigDecimal('20')) == 0}">Từ 20 m²</option>
                            <option value="25" th:selected="${minArea != null && minArea.compareTo(new java.math.BigDecimal('25')) == 0}">Từ 25 m²</option>
                            <option value="30" th:selected="${minArea != null && minArea.compareTo(new java.math.BigDecimal('30')) == 0}">Từ 30 m² trở lên</option>
                        </select>
                    </div>

                    <!-- 5. Nút Bấm: Lọc & Xóa bộ lọc -->
                    <div class="col-12 col-lg-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                            Áp dụng lọc
                        </button>
                        <a th:href="@{/rooms}" class="btn btn-outline-secondary btn-sm" title="Đặt lại bộ lọc">
                            Xóa lọc
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div id="room-list" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3 g-lg-4">
            <div th:if="${#lists.isEmpty(rooms)}" class="col-12 text-center py-5 text-secondary">
                <p class="mb-0">Hiện tại chưa có phòng nào khả dụng.</p>
            </div>
            <div class="col" th:each="room : ${rooms}" th:attr="data-room-code=${room.roomCode}">
                <div class="card room-card h-100">
                    <div class="room-cover position-relative">
                        <img class="w-100" th:src="${room.coverImagePath != null and !room.coverImagePath.empty ? room.coverImagePath : '/images/room-plan.svg'}"
                             alt="Ảnh minh họa phòng" width="320" height="140" style="object-fit: cover; max-height: 180px;"
                             onerror="this.src='/images/room-plan.svg'">
                        <span class="badge room-status">Còn cho thuê</span>
                    </div>
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <h3 class="h5 mb-0" th:text="|Phòng ${room.roomCode}|"></h3>
                            <span class="text-secondary small" th:text="|Tầng ${room.floorNumber}|"></span>
                        </div>
                        <div class="d-flex flex-wrap gap-3 small text-secondary my-3">
                            <span th:if="${room.areaM2 != null}"><svg th:replace="~{fragments/shared :: icon('area')}"></svg> <span th:text="|${room.areaM2} m²|"></span></span>
                            <span><svg th:replace="~{fragments/shared :: icon('people')}"></svg> <span th:text="|Tối đa ${room.capacity} người|"></span></span>
                        </div>
                        <div class="mt-auto border-top pt-3 d-flex align-items-center justify-content-between">
                            <div>
                                <strong class="price text-primary" th:text="${#numbers.formatDecimal(room.listedMonthlyRent, 0, 'POINT', 0, 'POINT')} + ' đ'"></strong> <span class="small text-secondary">/ tháng</span>
                            </div>
                            <a th:href="@{/rooms/{id}(id=${room.id})}" class="btn btn-outline-primary btn-sm px-3">Chi tiết</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p class="small text-secondary mt-3 mb-0" id="room-result" role="status"></p>
    </section>

    <script defer th:src="@{/js/room-filter.js}"></script>
</article>
</body>
</html>

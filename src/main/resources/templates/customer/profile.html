<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shared :: head('Hồ sơ cá nhân')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<a th:replace="~{fragments/shared :: skip}"></a>

<header th:replace="~{fragments/customer-nav :: navbar('Hồ sơ cá nhân')}"></header>

<main id="main" class="container py-4 py-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="mb-3">
                <a th:href="@{/}" class="text-decoration-none small fw-semibold">
                    &larr; Quay lại trang chủ
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-sm-5">
                    <h1 class="h4 fw-bold mb-1">Thông tin cá nhân</h1>
                    <p class="text-secondary small mb-4">
                        Cập nhật họ tên, số điện thoại và số CCCD của bạn. Thông tin mới sẽ được hiển thị trực tiếp trên hồ sơ hợp đồng.
                    </p>

                    <div th:if="${param.success}" class="alert alert-success small" role="alert">
                        Cập nhật hồ sơ cá nhân thành công!
                    </div>

                    <div th:if="${error}" class="alert alert-danger small" role="alert" th:text="${error}"></div>

                    <form th:action="@{/profile}" th:object="${profile}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email đăng nhập</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control bg-light"
                                   readonly disabled>
                            <div class="form-text small">Email là định danh tài khoản và không thể thay đổi.</div>
                        </div>

                        <div class="mb-3">
                            <label for="fullName" class="form-label small fw-semibold">Họ và tên</label>
                            <input type="text" id="fullName" th:field="*{fullName}" maxlength="150"
                                   class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                   placeholder="Nhập họ và tên">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-12 col-sm-6">
                                <label for="phone" class="form-label small fw-semibold">Số điện thoại</label>
                                <input type="text" id="phone" th:field="*{phone}" maxlength="10"
                                       class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                       placeholder="Gồm 10 chữ số">
                                <div class="invalid-feedback" th:errors="*{phone}"></div>
                            </div>

                            <div class="col-12 col-sm-6">
                                <label for="identityDocumentNo" class="form-label small fw-semibold">Số CCCD</label>
                                <input type="text" id="identityDocumentNo" th:field="*{identityDocumentNo}" maxlength="12"
                                       class="form-control" th:classappend="${#fields.hasErrors('identityDocumentNo')} ? 'is-invalid'"
                                       placeholder="Gồm 12 chữ số">
                                <div class="invalid-feedback" th:errors="*{identityDocumentNo}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/shared :: scripts}"></th:block>
</body>
</html>

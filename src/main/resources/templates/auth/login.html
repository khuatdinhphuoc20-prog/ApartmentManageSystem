<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shared :: head('Đăng nhập')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<a th:replace="~{fragments/shared :: skip}"></a>

<header class="bg-white border-bottom">
    <div class="container d-flex align-items-center justify-content-between py-3 px-3 px-sm-4">
        <a th:href="@{/}" class="text-decoration-none text-dark">
            <span th:replace="~{fragments/shared :: brand}"></span>
        </a>
        <a class="btn btn-outline-primary btn-sm" th:href="@{/register}">Đăng ký</a>
    </div>
</header>

<main id="main" class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-sm-5">
                    <h1 class="h4 fw-bold mb-1">Đăng nhập</h1>
                    <p class="text-secondary small mb-4">
                        Email đăng nhập có phân biệt chữ hoa và chữ thường.
                    </p>

                    <div th:if="${param.success}" class="alert alert-success small" role="alert">
                        Đăng ký tài khoản thành công! Vui lòng đăng nhập.
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger small" role="alert">
                        Email hoặc mật khẩu không chính xác!
                    </div>

                    <div th:if="${error}" class="alert alert-danger small" role="alert" th:text="${error}"></div>

                    <div th:if="${param.logout}" class="alert alert-info small" role="alert">
                        Bạn đã đăng xuất thành công.
                    </div>

                    <form th:action="@{/login}" th:object="${loginRequest}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   placeholder="Nhập email" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold">Mật khẩu</label>
                            <input type="password" id="password" th:field="*{password}" class="form-control"
                                   placeholder="Nhập mật khẩu" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center small text-secondary mb-0">
                        Chưa có tài khoản?
                        <a th:href="@{/register}" class="fw-semibold text-decoration-none">Đăng ký ngay</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/shared :: scripts}"></th:block>
</body>
</html>

spring.application.name=rental-apartment
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=RentalApartmentDev;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Tài khoản người thuê để test giao diện
spring.security.user.name=admin
spring.security.user.password=123456
spring.security.user.roles= USER
spring.application.name=rental-apartment

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RentalApartmentDev;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# Cấu hình tài khoản test có cả 2 quyền ADMIN và USER
spring.security.user.name=admin
spring.security.user.password=123456
spring.security.user.roles=ADMIN,USER